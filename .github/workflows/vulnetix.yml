          api-key: ${{ secrets.VULNETIX_API_KEY }}
          artifact-name: sca
          fail-on-findings: false

  publish:
    name: Publish
    runs-on: [self-hosted, Linux, X64, vulnetix-local]
    if: ${{ !cancelled() }}
    needs: [secrets, sast-python, sast-java, sast-javascript, sast-typescript, sast-c-cpp, sast-go, sast-php, sast-ruby, sast-kotlin, sast-csharp, sast-shell, sast-rust, iac, containers, license, cbom, aibom, analyze, sbom]
    permissions:
      contents: read
      actions: read
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: Vulnetix/cli/gha-upload@v4.23.0
        with:
          org-id: ${{ secrets.VULNETIX_ORG_ID }}
          api-key: ${{ secrets.VULNETIX_API_KEY }}
          fail-on-findings: false
